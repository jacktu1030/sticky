name: sticky_android
description: A sticky note Android app with calendar and reminders.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^17.2.1
  android_alarm_manager_plus: ^4.0.4
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  intl: ^0.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
